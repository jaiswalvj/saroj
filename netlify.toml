[build]
  command   = "npx vite build"
  publish   = "dist/public"

[functions]
  node_bundler = "esbuild"

# Forward the contact API call to the serverless function
[[redirects]]
  from   = "/api/contact"
  to     = "/.netlify/functions/contact"
  status = 200
  force  = true

# SPA fallback — all routes serve index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
